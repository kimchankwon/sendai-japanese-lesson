=== bullets | kin
sec: 心構え
eyebrow: Expectations · 01
h2: Respect Japanese culture.
- Be politer with people older than you. | Age matters in Japan. A small bow and a quiet voice go a long way.
- Keep it low-key in public. | Trains and shops are quiet.
- Avoid confrontation. | Save strong or direct language for when it is actually needed.

=== bullets | kin
sec: 心構え
eyebrow: Expectations · 01
h2: Focus on the connection.
- You won't be able to converse in Japanese. | One hour gets you a greeting and a short introduction. Nobody expects more than that.
- It's okay not to know everything. | People respond to the attempt. You don't have to get it right.
- Use a translation app. | Show them your screen and point. This is normal and people are used to it.

=== facts | aoba
sec: 仙台
eyebrow: About Sendai · 02
h2: What Sendai is known for.
- 杜{もり}の都{みやこ} | Mori no Miyako | Sendai's name for itself. Zelkova trees line the main streets.
- 伊達政宗{だてまさむね} | Date Masamune | Founded the city in 1600. He lost an eye to smallpox as a child and was nicknamed the One-Eyed Dragon.
- 支倉常長{はせくらつねなが} | Hasekura Tsunenaga | Masamune's envoy. He sailed to Mexico, Spain and Rome in 1613 and was baptised there. Japan had banned Christianity by the time he got home.
- 牛{ぎゅう}タン | Gyuutan | Grilled beef tongue. A Sendai chef started serving it in 1948 and it became the city's signature dish.
- ずんだ餅{もち} | Zunda mochi | Rice cakes topped with sweet mashed edamame. Bright green, and sweeter than it looks.
- 七夕{たなばた}まつり | Tanabata matsuri | Held every August. Paper streamers hang three storeys down through the shopping arcades. It is the largest Tanabata festival in Japan.

=== phrase | aoba

en: Yes · No
note: **Iie** is blunt on its own. To decline something, **daijoubu desu** (だいじょうぶです) is softer.

sec: 困ったとき
romaji: Nihongo ga wakarimasen
jp: 日本語{にほんご}がわかりません
en: I don't understand Japanese
note: Start with **Sumimasen**. Use it when someone is talking and you have lost the thread.

=== phrase | hi
sec: 困ったとき
romaji: Mou ichido onegaishimasu
jp: もう一度{いちど}お願{ねが}いします
en: One more time, please
note: Add **yukkuri** (ゆっくり) in front for "slowly, one more time please".

=== phrase | hi
sec: 困ったとき
romaji: Eigo ga hanasemasu ka?
jp: 英語{えいご}が話{はな}せますか
en: Can you speak English?
note: Ask this in Japanese rather than in English. It comes across as more polite.

=== practice | hi
sec: 練習
tag: Pair practice | ペア
task: Your partner speaks only Japanese, fast. *Slow them down*, then find the toilet.
foot: Partner · speak real Japanese or gibberish, just keep going

=== divider | kin
jp: 教会{きょうかい}のことば
sub: Church words
count: 08 · four phrases

=== vocab | kin
sec: 教会
eyebrow: Recognise these when you hear them
- Kamisama | 神様{かみさま} | God
- Iesusama | イエス様{さま} | Jesus
- Kyoukai | 教会{きょうかい} | church
note: **-sama** is the highest honorific in Japanese. Always use it with these two names.

=== phrase | kin
sec: 教会
romaji: Watashi wa kurisuchan desu
jp: 私{わたし}はクリスチャンです
en: I am a Christian
note: About 1% of Japan is Christian, so this is unfamiliar to most people. Most will be curious and ask you about it.

=== practice | kin
sec: 練習
tag: Everything | まとめ
task: Greet. Name. Major. Hobby. And that you're a Christian. *No notes.*
foot: Then do it once more with someone you haven't practised with

=== bullets | aoba
sec: まとめ
eyebrow: Summary
h2: Putting it together.
- Start with sumimasen. | Then your name, your major and your hobby. That is a full introduction.
- When you get stuck, you have three phrases. | Wakarimasen. Mou ichido onegaishimasu. Eigo ga hanasemasu ka.
- Use your phone after that. | You have enough Japanese to start a conversation. The translation app can carry the rest.

=== phrase | kin
opt: yes
sec: 任意
flag: If time | 任意
romaji: Issho ni kyoukai ni ikimasen ka?
jp: 一緒{いっしょ}に教会{きょうかい}に行{い}きませんか
en: Would you like to go to church together?
note: The *-masen ka* ending makes this an invitation rather than a request. Use it with someone you already know.

=== phrase | kin
opt: yes
sec: 任意
flag: If time | 任意
romaji: Issho ni inorimashou
jp: 一緒{いっしょ}に祈{いの}りましょう
en: Let's pray together
note: With someone you have just met, ask permission first: **Inotte mo ii desu ka** (祈{いの}ってもいいですか), "may I pray?"

=== vocab | kin
opt: yes
sec: 任意
flag: If time | 任意
eyebrow: Words you will hear in a Japanese service
- Ai | 愛{あい} | love
- Inori | 祈{いの}り | prayer
- Seisho | 聖書{せいしょ} | the Bible
- Shukufuku | 祝福{しゅくふく} | blessing
- Sanbi | 賛美{さんび} | worship, praise
- Megumi | 恵{めぐ}み | grace

</script>

<div class="status" id="status">
  <span id="statusText" class="grow"></span>
  <button id="btnSave">Save file</button>
  <button id="btnRevert" class="ghost">Revert</button>
  <button id="btnDone" class="ghost">Done</button>
</div>

<div class="deck" id="deck"></div>
<div class="bar" id="bar"></div>
<div class="hint" id="hint">← → move · E edit · F fullscreen</div>
<div class="chrome">
  <span class="num" id="num"></span>
  <button id="prev" aria-label="Previous slide">‹</button>
  <button id="next" aria-label="Next slide">›</button>
</div>

<script>
(function(){
  'use strict';
  var KEY = 'sendai-deck-v1';
  var SRC  = document.getElementById('content');
  var DECK = document.getElementById('deck');
  var model = [], i = 0, editing = false, dirty = false;

  /* ---------------- text -> html ---------------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inline(s){
    if(s == null) return '';
    var out = esc(s);
    out = out.replace(/([一-鿿々㐀-䶿]+)\{([^{}]*)\}/g,
                      '<ruby>$1<rt>$2</rt></ruby>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    out = out.replace(/_{2,}/g, '<small>___</small>');
    out = out.replace(/ \/ /g, ' <small>/</small> ');
    return out;
  }

  /* ---------------- parse ---------------- */
  function parse(src){
    var slides = [], errors = [], cur = null, list = 'items';
    src.split('\n').forEach(function(raw, n){
      var line = raw.trim(), ln = n + 1;
      if(!line || line.charAt(0) === '#') return;
      if(line.slice(0,3) === '==='){
        var p = line.slice(3).split('|');
        cur = { type: (p[0]||'').trim(), rail: (p[1]||'aoba').trim(), f: {}, L: {} };
        if(!RENDER[cur.type]) errors.push('Line ' + ln + ': unknown slide type "' + cur.type + '"');
        slides.push(cur); list = 'items'; return;
      }
      if(!cur){ errors.push('Line ' + ln + ': text before the first === slide'); return; }
      if(line.slice(0,2) === '- '){
        (cur.L[list] = cur.L[list] || []).push(
          line.slice(2).split('|').map(function(x){ return x.trim(); }));
        return;
      }
      var m = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if(!m){ errors.push('Line ' + ln + ': expected "key: value" or "- item"'); return; }
      if(m[2] === ''){ list = m[1]; cur.L[list] = cur.L[list] || []; }
      else { cur.f[m[1]] = m[2]; }
    });
    return { slides: slides, errors: errors };
  }

  function serialize(slides){
    return '\n' + slides.map(function(s){
      var out = '=== ' + s.type + ' | ' + s.rail + '\n';
      Object.keys(s.f).forEach(function(k){ out += k + ': ' + s.f[k] + '\n'; });
      Object.keys(s.L).sort(function(a,b){
        return a === 'items' ? -1 : b === 'items' ? 1 : 0;
      }).forEach(function(n){
        if(n !== 'items') out += n + ':\n';
        s.L[n].forEach(function(row){ out += '- ' + row.join(' | ') + '\n'; });
      });
      return out;
    }).join('\n') + '\n';
  }

  /* ---------------- editable element builders ---------------- */
  function ce(ph){
    return editing ? ' contenteditable="true" spellcheck="false" data-ph="' + esc(ph) + '"' : '';
  }
  /* field */
  function F(si, key, tag, cls, ph, optional){
    var raw = model[si].f[key] || '';
    if(!raw && !editing && optional) return '';
    return '<' + tag + ' class="' + cls + '" data-i="' + si + '" data-f="' + key + '"' +
           ce(ph || key) + '>' + (editing ? esc(raw) : inline(raw)) + '</' + tag + '>';
  }
  /* list cell */
  function C(si, ln, r, c, tag, cls){
    var raw = (model[si].L[ln][r][c] || '');
    return '<' + tag + ' class="' + cls + '" data-i="' + si + '" data-l="' + ln +
           '" data-r="' + r + '" data-c="' + c + '"' + ce('…') + '>' +
           (editing ? esc(raw) : inline(raw)) + '</' + tag + '>';
  }
  function rows(si, ln){ return (model[si].L[ln] || []); }

  function chrome(si){
    var s = model[si], out = '';
    if(s.f.sec) out += F(si, 'sec', 'div', 'sec', 'section');
    if(s.f.flag){
      var p = s.f.flag.split('|');
      out += '<div class="flag" data-i="' + si + '" data-f="flag"' + ce('If time') + '>' +
             (editing ? esc(s.f.flag)
                      : esc(p[0].trim()) + (p[1] ? ' <b class="j">' + inline(p[1].trim()) + '</b>' : '')) +
             '</div>';
    }
    return out;
  }

  /* ---------------- renderers ---------------- */
  var RENDER = {
    title: function(si){
      var cols = ['sakura','kin','aoba','sora','murasaki','hi'],
          xs = [8,15,23,79,86,93], st = '';
      for(var k = 0; k < 6; k++)
        st += '<i style="left:' + xs[k] + '%;background:var(--' + cols[k] +
              ');animation-delay:-' + (k * 1.3 + 0.4).toFixed(1) + 's"></i>';
      return '<div class="streamers">' + st + '</div>' +
             F(si,'kanji','div','kanji','仙台') +
             F(si,'h1','h1','','Title') +
             F(si,'sub','div','sub','Subtitle', true);
    },
    toc: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        '<ul class="toc">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','n') +
                 C(si,'items',r,1,'span','j') + C(si,'items',r,2,'span','e') + '</li>';
        }).join('') + '</ul>';
    },
    bullets: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading') +
        '<ul class="bullets">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','t') +
                 C(si,'items',r,1,'span','d') + '</li>';
        }).join('') + '</ul>';
    },
    facts: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading') +
        '<ul class="facts">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','t') + C(si,'items',r,1,'span','r') +
                 C(si,'items',r,2,'span','d') + '</li>';
        }).join('') + '</ul>';
    },
    divider: function(si){
      return chrome(si) + F(si,'jp','div','jptitle','日本語') +
             F(si,'sub','div','sub','Section name') +
             F(si,'count','div','count','01 · two phrases', true);
    },
    phrase: function(si){
      var out = chrome(si) +
        '<div class="card">' + F(si,'romaji','div','romaji','Romaji') +
        F(si,'jp','div','jp','日本語') + F(si,'en','div','en','English') + '</div>' +
        F(si,'note','div','note','Note', true);
      if(rows(si,'vocab').length)
        out += '<ul class="vocab">' + rows(si,'vocab').map(function(_, r){
          return '<li>' + C(si,'vocab',r,0,'span','w') + C(si,'vocab',r,1,'span','k') +
                 C(si,'vocab',r,2,'span','g') + '</li>';
        }).join('') + '</ul>';
      if(rows(si,'chips').length)
        out += '<ul class="chips">' + rows(si,'chips').map(function(_, r){
          return '<li>' + C(si,'chips',r,0,'span','w') + C(si,'chips',r,1,'span','g') + '</li>';
        }).join('') + '</ul>';
      return out;
    },
    vocab: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading', true) +
        '<ul class="vocab">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','w') + C(si,'items',r,1,'span','k') +
                 C(si,'items',r,2,'span','g') + '</li>';
        }).join('') + '</ul>' +
        F(si,'note','div','note','Note', true);
    },
    practice: function(si){
      var s = model[si], p = (s.f.tag || '').split('|');
      return chrome(si) +
        '<div class="tag" data-i="' + si + '" data-f="tag"' + ce('Pair practice') + '>' +
        (editing ? esc(s.f.tag || '')
                 : esc((p[0]||'').trim()) + (p[1] ? ' <b class="j">' + inline(p[1].trim()) + '</b>' : '')) +
        '</div>' + F(si,'task','p','task','Task') + F(si,'foot','div','foot','Footnote', true);
    }
  };

  /* ---------------- render ---------------- */
  function render(){
    DECK.innerHTML = model.map(function(s, si){
      var body = RENDER[s.type] ? RENDER[s.type](si)
        : '<div class="fatal">Unknown slide type "' + esc(s.type) + '"</div>';
      return '<section class="slide' + (s.type === 'practice' ? ' practice' : '') +
             (s.type === 'title' ? ' title' : '') + (s.type === 'divider' ? ' divider' : '') +
             (s.f.opt ? ' optional' : '') +
             '" style="--rail:var(--' + s.rail + ')">' + body + '</section>';
    }).join('');
    show(i);
  }

  function show(n){
    var slides = DECK.children;
    if(!slides.length) return;
    i = Math.max(0, Math.min(slides.length - 1, n));
    for(var k = 0; k < slides.length; k++) slides[k].classList.toggle('on', k === i);
    var bar = document.getElementById('bar');
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    bar.style.background = getComputedStyle(slides[i]).getPropertyValue('--rail');
    document.getElementById('num').textContent = (i + 1) + ' / ' + slides.length;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch(e){}
  }

  /* ---------------- load ---------------- */
  function load(src){
    var res = parse(src);
    if(res.errors.length){
      DECK.innerHTML = '<section class="slide on"><div class="fatal"><h3>' +
        res.errors.length + ' problem' + (res.errors.length > 1 ? 's' : '') +
        ' in the lesson text</h3>' + res.errors.map(esc).join('<br>') + '</div></section>';
      return false;
    }
    model = res.slides;
    render();
    return true;
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if(!(saved && load(saved))) { saved = null; load(SRC.textContent); }
  dirty = !!saved;

  /* ---------------- status bar ---------------- */
  var status = document.getElementById('status'), statusText = document.getElementById('statusText');
  function paintStatus(){
    var on = editing || dirty;
    status.classList.toggle('show', on);
    document.body.classList.toggle('editing', editing);
    statusText.innerHTML = editing
      ? 'Editing — click any text to change it. <kbd>Esc</kbd> when done.'
      : 'You have unsaved edits in this browser only. Press <kbd>S</kbd> to download index.html.';
  }
  function setEditing(on){ editing = on; render(); paintStatus(); }
  paintStatus();

  /* ---------------- capture edits ---------------- */
  DECK.addEventListener('input', function(e){
    var el = e.target.closest('[data-i]');
    if(!el) return;
    var s = model[+el.dataset.i], v = el.textContent;
    if(el.dataset.f !== undefined) s.f[el.dataset.f] = v;
    else s.L[el.dataset.l][+el.dataset.r][+el.dataset.c] = v;
    dirty = true;
    try { localStorage.setItem(KEY, serialize(model)); } catch(err){}
  });
  DECK.addEventListener('paste', function(e){
    if(!editing) return;
    e.preventDefault();
    document.execCommand('insertText', false,
      (e.clipboardData || window.clipboardData).getData('text/plain'));
  });

  /* ---------------- save / revert ---------------- */
  function save(){
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#content').textContent = serialize(model);
    clone.querySelector('#deck').innerHTML = '';
    clone.querySelector('#status').classList.remove('show');
    clone.querySelector('body').classList.remove('editing');
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], {type: 'text/html'});
    var a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function revert(){
    if(dirty && !confirm('Discard your local edits and go back to the saved lesson text?')) return;
    try { localStorage.removeItem(KEY); } catch(e){}
    dirty = false; editing = false;
    load(SRC.textContent); paintStatus();
  }

  document.getElementById('btnSave').onclick   = save;
  document.getElementById('btnRevert').onclick = revert;
  document.getElementById('btnDone').onclick   = function(){ setEditing(false); };
  document.getElementById('next').onclick = function(){ show(i + 1); };
  document.getElementById('prev').onclick = function(){ show(i - 1); };

  /* ---------------- keys ---------------- */
  document.addEventListener('keydown', function(e){
    var typing = e.target.isContentEditable;
    if(e.key === 'Escape' && editing){ e.preventDefault(); setEditing(false); return; }
    if(typing) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    switch(e.key){
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown':
        e.preventDefault(); show(i + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); show(i - 1); break;
      case 'Home': e.preventDefault(); show(0); break;
      case 'End':  e.preventDefault(); show(DECK.children.length - 1); break;
      case 'e': case 'E': e.preventDefault(); setEditing(!editing); break;
      case 's': case 'S': e.preventDefault(); save(); break;
      case 'r': case 'R': e.preventDefault(); revert(); break;
      case 'f': case 'F':
        e.preventDefault();
        if(document.fullscreenElement) document.exitFullscreen();
        else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        break;
    }
  });

  var x0 = null;
  document.addEventListener('touchstart', function(e){
    if(editing) return; x0 = e.changedTouches[0].clientX;
  }, {passive: true});
  document.addEventListener('touchend', function(e){
    if(x0 === null || editing) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 55) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive: true});

  var start = parseInt((location.hash || '').slice(1), 10);
  show(isNaN(start) ? 0 : start - 1);
})();
</script>
