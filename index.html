<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仙台 · Sendai Missions Japanese Lesson</title>
<style>
  :root{
    --ground:#10131F; --raised:#1A2033;
    --ink:#F4EFE4; --ink-dim:#C6C3BC; --muted:#8A90A8; --hair:#2C3350;
    --aoba:#5BB89C; --sakura:#E8607F; --sora:#6C8FD6;
    --murasaki:#A87FD1; --hi:#E8834B; --kin:#E8B84B;
    --rail:var(--aoba);
    --f-disp:"Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
    --f-jp:"Hiragino Mincho ProN","YuMincho","Yu Mincho","Noto Serif JP","MS Mincho",serif;
    --f-kana:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
    --f-ui:"Helvetica Neue",Arial,sans-serif;
    --f-mono:"SF Mono","Menlo","Consolas",monospace;
    --u0:clamp(12px,1.78vmin,28px);
    --u:var(--u0);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--f-ui); overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  .deck{position:fixed; inset:0}
  .slide{
    position:absolute; inset:0; display:none;
    padding:calc(var(--u)*3.4) calc(var(--u)*5.5) calc(var(--u)*6.2) calc(var(--u)*10.5);
    flex-direction:column; justify-content:center;
  }
  .slide.on{display:flex}
  .inner{display:flex; flex-direction:column; width:100%; min-width:0}
  .slide::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:calc(var(--u)*1.1);
    background:linear-gradient(180deg,var(--rail),color-mix(in oklab,var(--rail) 35%,var(--ground)));
  }
  .sec{
    position:absolute; left:calc(var(--u)*2.6); top:calc(var(--u)*4);
    writing-mode:vertical-rl; font-family:var(--f-jp);
    font-size:calc(var(--u)*1.9); letter-spacing:.34em; color:var(--rail); opacity:.85;
  }

  .eyebrow{
    font-size:calc(var(--u)*1.4); font-weight:700; letter-spacing:.26em;
    text-transform:uppercase; color:var(--muted); margin-bottom:calc(var(--u)*2);
  }
  h1{
    font-family:var(--f-disp); font-weight:700; letter-spacing:-.02em;
    font-size:calc(var(--u)*9.6); line-height:1.02; margin:0; text-wrap:balance;
  }
  h2{
    font-family:var(--f-disp); font-weight:700; letter-spacing:-.015em;
    font-size:calc(var(--u)*5); line-height:1.08; margin:0 0 calc(var(--u)*2.4);
    text-wrap:balance;
  }

  .card{display:flex; flex-direction:column; gap:calc(var(--u)*1.5)}
  .romaji{
    font-family:var(--f-disp); font-weight:700; letter-spacing:-.025em;
    font-size:calc(var(--u)*7.2); line-height:1; color:var(--ink);
  }
  .romaji small{
    font-size:.42em; letter-spacing:.04em; color:var(--muted);
    font-weight:700; display:inline-block; vertical-align:.55em;
  }
  .jp{font-family:var(--f-jp); font-size:calc(var(--u)*4.2); line-height:1.9; color:var(--rail)}
  .jp rt{font-family:var(--f-kana); font-size:.4em; color:var(--muted); letter-spacing:.04em; font-weight:400}
  .en{font-size:calc(var(--u)*2.4); color:var(--ink-dim); letter-spacing:.01em}
  .note{
    margin-top:calc(var(--u)*1.6); font-size:calc(var(--u)*1.85); color:var(--muted);
    line-height:1.65; max-width:44ch; border-left:2px solid var(--hair);
    padding-left:calc(var(--u)*1.6);
  }
  .note rt{font-family:var(--f-kana); font-size:.44em}

  .toc{list-style:none; margin:0; padding:0; display:grid; gap:calc(var(--u)*1.15);
       grid-template-columns:1fr 1fr; max-width:calc(var(--u)*84)}
  .toc li{
    display:flex; align-items:baseline; gap:calc(var(--u)*1.6);
    font-size:calc(var(--u)*2.4); color:var(--ink-dim);
    padding:calc(var(--u)*.75) 0; border-bottom:1px solid var(--hair);
  }
  .toc .n{font-variant-numeric:tabular-nums; font-size:calc(var(--u)*1.5);
          letter-spacing:.14em; color:var(--muted); font-weight:700; min-width:2.4ch}
  .toc .j{font-family:var(--f-jp); color:var(--muted); font-size:.86em}

  .bullets{list-style:none; margin:0; padding:0; display:flex;
           flex-direction:column; gap:calc(var(--u)*2.3); max-width:calc(var(--u)*72)}
  .bullets li{font-size:calc(var(--u)*2.9); line-height:1.4; color:var(--ink);
              padding-left:calc(var(--u)*2.4); position:relative}
  .bullets li::before{content:""; position:absolute; left:0; top:.62em;
    width:calc(var(--u)*1.1); height:2px; background:var(--rail)}
  .bullets .d{display:block; font-size:calc(var(--u)*1.95); color:var(--muted);
              margin-top:calc(var(--u)*.7); line-height:1.6}

  .vocab{list-style:none; margin:calc(var(--u)*1.6) 0 0; padding:0; display:grid;
         grid-template-columns:repeat(3,minmax(0,1fr));
         gap:calc(var(--u)*1.4) calc(var(--u)*3); max-width:calc(var(--u)*84)}
  .vocab li{border-top:1px solid var(--hair); padding-top:calc(var(--u)*1);
            font-family:var(--f-disp); font-weight:700; letter-spacing:-.01em;
            font-size:calc(var(--u)*2.65); color:var(--ink)}
  .vocab .k{display:block; font-family:var(--f-jp); font-weight:400;
            font-size:calc(var(--u)*2.05); color:var(--rail); margin-top:.15em}
  .vocab .k rt{font-family:var(--f-kana); font-size:.42em; color:var(--muted)}
  .vocab .g{display:block; font-family:var(--f-ui); font-weight:400;
            font-size:calc(var(--u)*1.6); color:var(--muted); margin-top:.3em}

  .chips{display:flex; flex-wrap:wrap; gap:calc(var(--u)*1); margin-top:calc(var(--u)*2.2)}
  .chips li{list-style:none; font-family:var(--f-jp); font-size:calc(var(--u)*2);
            padding:calc(var(--u)*.55) calc(var(--u)*1.4);
            border:1px solid var(--hair); border-radius:999px; color:var(--ink-dim)}
  .chips .g{color:var(--muted); font-family:var(--f-ui); font-size:.72em;
            margin-left:.6em; letter-spacing:.06em}

  .facts{list-style:none; margin:calc(var(--u)*1.4) 0 0; padding:0; display:grid;
         grid-template-columns:1fr 1fr; gap:calc(var(--u)*1.9) calc(var(--u)*4.5); max-width:calc(var(--u)*84)}
  .facts li{border-top:1px solid var(--hair); padding-top:calc(var(--u)*.9)}
  .facts .t{display:block; font-family:var(--f-jp); font-size:calc(var(--u)*2.75);
            color:var(--rail); line-height:1.5}
  .facts .t rt{font-family:var(--f-kana); font-size:.4em; color:var(--muted)}
  .facts .r{display:block; font-family:var(--f-disp); font-weight:700; letter-spacing:.02em;
            font-size:calc(var(--u)*1.65); color:var(--ink-dim); margin-top:.15em}
  .facts .d{display:block; font-size:calc(var(--u)*1.78); color:var(--muted);
            line-height:1.6; margin-top:calc(var(--u)*.7); max-width:42ch}

  .practice{background:var(--raised)}
  .tag{display:inline-flex; align-items:center; gap:calc(var(--u)*1.1);
       font-weight:700; font-size:calc(var(--u)*1.45); letter-spacing:.26em;
       text-transform:uppercase; color:var(--ground); background:var(--rail);
       padding:calc(var(--u)*.6) calc(var(--u)*1.5); align-self:flex-start;
       margin-bottom:calc(var(--u)*3)}
  .tag .j{font-family:var(--f-jp); letter-spacing:.2em; font-weight:400}
  .task{font-family:var(--f-disp); font-weight:700; letter-spacing:-.015em;
        font-size:calc(var(--u)*4.6); line-height:1.22; max-width:24ch; margin:0; text-wrap:balance}
  .task em{font-style:normal; color:var(--rail)}
  .foot{margin-top:calc(var(--u)*3.4); font-size:calc(var(--u)*1.9);
        color:var(--muted); letter-spacing:.04em}

  .divider .inner{align-items:flex-start}
  .jptitle{font-family:var(--f-jp); font-size:calc(var(--u)*9); line-height:1.1;
           color:var(--rail); margin:0 0 calc(var(--u)*1.5); letter-spacing:.08em}
  .jptitle rt{font-family:var(--f-kana); font-size:.28em; color:var(--muted)}
  .divider .sub{font-family:var(--f-disp); font-weight:700;
                font-size:calc(var(--u)*3.2); letter-spacing:.02em; color:var(--ink)}
  .divider .count{margin-top:calc(var(--u)*2.6); font-size:calc(var(--u)*1.65);
                  color:var(--muted); letter-spacing:.2em; text-transform:uppercase; font-weight:700}

  .optional{background:
    repeating-linear-gradient(135deg,transparent 0 22px,rgba(232,184,75,.028) 22px 44px),
    var(--ground)}
  .flag{align-self:flex-start; display:inline-flex; align-items:center; gap:calc(var(--u)*1);
        border:1px dashed var(--kin); color:var(--kin);
        padding:calc(var(--u)*.55) calc(var(--u)*1.4); margin-bottom:calc(var(--u)*2.6);
        font-size:calc(var(--u)*1.4); font-weight:700; letter-spacing:.24em; text-transform:uppercase}
  .flag .j{font-family:var(--f-jp); font-weight:400; letter-spacing:.16em}

  .title{padding-left:calc(var(--u)*11); justify-content:center}
  .streamers{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .streamers i{position:absolute; top:-14%; width:calc(var(--u)*1.5); height:118%;
    border-radius:999px; opacity:.16; transform-origin:top center;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 38%,transparent 92%);
    mask-image:linear-gradient(180deg,#000 0%,#000 38%,transparent 92%);
    animation:sway 9s ease-in-out infinite}
  @keyframes sway{
    0%,100%{transform:rotate(-1.6deg) translateY(0)}
    50%{transform:rotate(1.9deg) translateY(calc(var(--u)*-1))}
  }
  .kanji{font-family:var(--f-jp); font-size:calc(var(--u)*13); line-height:1;
         letter-spacing:.14em; color:var(--kin); margin-bottom:calc(var(--u)*2)}
  .title .sub{margin-top:calc(var(--u)*1.8); font-family:var(--f-disp); font-weight:700;
              font-size:calc(var(--u)*3.6); letter-spacing:-.005em; color:var(--muted)}

  .bar{position:fixed; left:0; bottom:0; height:3px; background:var(--rail);
       transition:width .34s cubic-bezier(.4,0,.2,1); z-index:5}
  .chrome{position:fixed; right:calc(var(--u)*3); bottom:calc(var(--u)*2.4);
          display:flex; align-items:center; gap:calc(var(--u)*1.4); z-index:6}
  .num{font-variant-numeric:tabular-nums; font-size:calc(var(--u)*1.5);
       color:var(--muted); letter-spacing:.14em}
  .chrome button{width:calc(var(--u)*3.4); height:calc(var(--u)*3.4); background:transparent;
    border:1px solid var(--hair); color:var(--muted); border-radius:50%; cursor:pointer;
    font-size:calc(var(--u)*1.6); line-height:1; display:grid; place-items:center;
    font-family:var(--f-ui)}
  .chrome button:hover{border-color:var(--rail); color:var(--rail)}
  .chrome button:focus-visible{outline:2px solid var(--kin); outline-offset:3px}
  .hint{position:fixed; left:calc(var(--u)*3.4); bottom:calc(var(--u)*2.6);
        font-size:calc(var(--u)*1.25); color:var(--hair); letter-spacing:.16em;
        text-transform:uppercase; font-weight:700; z-index:5}

  .slide.on .inner > *{animation:rise .46s cubic-bezier(.2,.7,.3,1) backwards}
  .slide.on .inner > *:nth-child(2){animation-delay:.07s}
  .slide.on .inner > *:nth-child(3){animation-delay:.14s}
  .slide.on .inner > *:nth-child(4){animation-delay:.21s}
  .card > *{animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards}
  .card > *:nth-child(2){animation-delay:.11s}
  .card > *:nth-child(3){animation-delay:.2s}
  @keyframes rise{from{opacity:0; transform:translateY(calc(var(--u)*1.4))} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important}}
  @media (max-width:760px){
    .toc,.facts{grid-template-columns:1fr}
    .vocab{grid-template-columns:1fr 1fr}
    .slide{padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*7) calc(var(--u)*9)}
  }

  /* ---------- edit mode ---------- */
  body.editing .slide{overflow-y:auto}
  body.editing [contenteditable]{
    outline:1px dashed var(--hair); outline-offset:5px; border-radius:2px;
    min-width:2ch; min-height:1em; white-space:pre-wrap;
  }
  body.editing [contenteditable]:hover{outline-color:var(--muted)}
  body.editing [contenteditable]:focus{outline:2px solid var(--kin); outline-offset:5px}
  body.editing [contenteditable]:empty::before{
    content:attr(data-ph); color:var(--hair); font-style:italic;
  }
  body.editing .inner > *{animation:none !important}
  body.editing .card > *{animation:none !important}

  .status{
    position:fixed; left:0; right:0; top:0; z-index:20; display:none;
    align-items:center; gap:calc(var(--u)*2); padding:calc(var(--u)*1.1) calc(var(--u)*3);
    background:var(--kin); color:#1A1405; font-size:calc(var(--u)*1.45);
    font-weight:700; letter-spacing:.06em;
  }
  .status.show{display:flex}
  .status .grow{flex:1}
  .status kbd{
    font-family:var(--f-mono); font-size:.86em; background:rgba(0,0,0,.16);
    padding:.15em .5em; border-radius:3px; letter-spacing:0;
  }
  .status button{
    font-family:var(--f-ui); font-weight:700; font-size:calc(var(--u)*1.35);
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    background:#1A1405; color:var(--kin); border:0; border-radius:3px;
    padding:calc(var(--u)*.7) calc(var(--u)*1.6);
  }
  .status button.ghost{background:transparent; color:#1A1405; border:1px solid rgba(0,0,0,.35)}
  .status button:focus-visible{outline:2px solid #1A1405; outline-offset:2px}
  body.editing .deck, body.editing .chrome, body.editing .hint{top:calc(var(--u)*4.2)}
  body.editing .chrome, body.editing .hint{top:auto}

  /* ---------- jump link on a slide ---------- */
  .jump{
    align-self:flex-start; margin-top:calc(var(--u)*3.2);
    display:inline-flex; align-items:center; gap:.6em; text-decoration:none;
    font-family:var(--f-ui); font-weight:700; font-size:calc(var(--u)*1.6);
    letter-spacing:.18em; text-transform:uppercase;
    color:var(--rail); border:1px solid var(--rail);
    padding:calc(var(--u)*.85) calc(var(--u)*1.8); border-radius:999px;
  }
  .jump:hover{background:var(--rail); color:var(--ground)}
  .jump:focus-visible{outline:2px solid var(--kin); outline-offset:3px}
  .jump .arw{font-size:1.1em; letter-spacing:0}
  body.editing .jump{border-style:dashed}

  /* ---------- cheat sheet ---------- */
  .sheet{position:fixed; inset:0; overflow-y:auto; background:var(--ground);
         display:none; z-index:10; padding:0 0 6vh}
  body.sheet-open{overflow:auto}
  body.sheet-open .sheet{display:block}
  body.sheet-open .deck,body.sheet-open .bar,
  body.sheet-open .chrome,body.sheet-open .hint{display:none}
  .sheet-top{
    position:sticky; top:0; z-index:2; background:var(--ground);
    border-bottom:1px solid var(--hair);
    display:flex; align-items:baseline; gap:1.4rem; flex-wrap:wrap;
    padding:1.5rem clamp(1.2rem,4vw,4rem);
  }
  .sheet-top h1{
    font-family:var(--f-disp); font-size:clamp(1.5rem,2.6vw,2.2rem);
    letter-spacing:-.01em; margin:0; color:var(--ink); flex:1 1 auto;
  }
  .sheet-top .kj{font-family:var(--f-jp); color:var(--kin); margin-right:.5em}
  .sheet-top a,.sheet-top button{
    font-family:var(--f-ui); font-weight:700; font-size:.78rem; letter-spacing:.18em;
    text-transform:uppercase; text-decoration:none; cursor:pointer;
    color:var(--muted); background:transparent; border:1px solid var(--hair);
    border-radius:999px; padding:.5rem 1.1rem;
  }
  .sheet-top a:hover,.sheet-top button:hover{color:var(--aoba); border-color:var(--aoba)}
  .sheet-top a:focus-visible,.sheet-top button:focus-visible{outline:2px solid var(--kin); outline-offset:2px}
  .sheet-body{
    padding:2rem clamp(1.2rem,4vw,4rem) 0;
    columns:23rem 3; column-gap:clamp(1.6rem,3vw,3.2rem);
  }
  .grp{break-inside:avoid; border-top:2px solid var(--rail);
       padding-top:.9rem; margin:0 0 2.1rem}
  .grp h2{
    font-family:var(--f-disp); font-size:1.02rem; letter-spacing:.16em;
    text-transform:uppercase; margin:0 0 1rem; color:var(--rail);
  }
  .grp h2 .kj{font-family:var(--f-jp); letter-spacing:.1em; text-transform:none;
               color:var(--muted); margin-left:.7em; font-size:1.05em}
  .grp.opt{border-top-style:dashed}
  .grp.opt h2::after{content:" · if time"; color:var(--muted); letter-spacing:.1em}
  .ph{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1rem}
  .ph li{display:grid; gap:.12rem; break-inside:avoid}
  .ph .r{font-family:var(--f-disp); font-weight:700; font-size:1.12rem;
         letter-spacing:-.005em; color:var(--ink); line-height:1.25}
  .ph .r small{font-size:.7em; color:var(--muted)}
  .ph .j{font-family:var(--f-jp); font-size:1.18rem; color:var(--rail); line-height:1.85}
  .ph .j rt{font-family:var(--f-kana); font-size:.42em; color:var(--muted)}
  .ph .e{font-size:.9rem; color:var(--muted); line-height:1.4}
  .wl{list-style:none; margin:1.1rem 0 0; padding:.9rem 0 0; border-top:1px solid var(--hair);
      display:grid; grid-template-columns:1fr 1fr; gap:.55rem 1rem}
  .wl li{font-size:.86rem; color:var(--muted); line-height:1.45; break-inside:avoid}
  .wl b{display:block; font-family:var(--f-jp); font-weight:400;
        font-size:1.02rem; color:var(--ink-dim)}
  .wl b rt{font-family:var(--f-kana); font-size:.42em; color:var(--muted)}

  @media print{
    body{background:#fff; color:#111; overflow:visible}
    body.sheet-open .sheet{position:static; background:#fff}
    .sheet-top{position:static; border-color:#bbb; padding-left:0; padding-right:0}
    .sheet-top a,.sheet-top button{display:none}
    .sheet-top h1{color:#111}
    .sheet-body{columns:2; column-gap:2rem; padding:1rem 0 0}
    .grp{margin:0 0 1.4rem; border-top-color:#111}
    .grp h2,.ph .j,.ph .j rt{color:#111}
    .ph .r{color:#000}
    .ph .e,.wl li,.wl b rt{color:#444}
    .wl b{color:#111}
    .wl{border-top-color:#bbb}
    @page{margin:14mm}
  }

  .fatal{padding:calc(var(--u)*6); font-family:var(--f-mono); line-height:1.8;
         font-size:calc(var(--u)*1.7); color:var(--sakura)}
  .fatal h3{font-family:var(--f-ui); color:var(--ink); font-size:calc(var(--u)*3)}
</style>
</head>
<body>

<!--
  ============================================================================
  EDIT THE LESSON HERE. Everything below is plain text — no HTML.

    === <type> | <colour>      starts a slide
    key: value                 a field on that slide
    key:                       (empty value) starts a named list
    - a | b | c                a list row, columns split on |
    # ...                      a comment, ignored

  Furigana:  漢字{かんじ}   →  kanji with reading above
  Emphasis:  **bold**  and  *highlight*
  Blanks:    ___  renders as a styled blank

  Add  link: <label>  to any slide for a button through to the cheat sheet.
  The cheat sheet builds itself from the phrases below — there is nothing
  separate to keep in step.

  Types:   title  toc  bullets  facts  divider  phrase  practice  vocab
  Colours: aoba (green) sakura (pink) sora (blue) murasaki (violet)
           hi (orange) kin (gold)
  Add  opt: yes  to any slide to mark it optional ("If time").

  You can also edit on the slides themselves: press E in the deck, type,
  then press S to download an updated index.html with your changes in here.
  ============================================================================
-->
<script id="content" type="text/deck">

=== title | kin
kanji: 仙台
h1: Sendai Mission 2026
sub: Japanese Lesson
link: Cheat sheet

=== toc | kin
eyebrow: Table of contents
- 01 | 心構え | Expectations
- 02 | 仙台 | About Sendai
- 03 | あいさつ | Greetings
- 04 | 自己紹介 | Your name
- 05 | 専攻・仕事 | What you study or do
- 06 | 趣味 | Your hobby
- 07 | 困ったとき | When you're stuck
- 08 | キリスト教 | Christian words
- 09 | まとめ | Put it together

=== bullets | kin
sec: 心構え
eyebrow: Expectations · 01
h2: Respect Japanese culture.
- Be more polite with people older than you. | Age hierarchy matters in Japan
- Keep it low-key in public. | Keep quiet on trains
- Avoid confrontation. | Save strong or direct language for when it is actually needed.

=== bullets | kin
sec: 心構え
eyebrow: Expectations · 02
h2: Focus on the connection.
- Japanese as entry | Use polite greetings as a form of entering a conversation
- It's okay to not know everything. | People respond to the effort, not perfection
- Use a translation app. | Accompanied by gestures

=== facts | aoba
sec: 仙台
eyebrow: About Sendai · 02
h2: What Sendai is known for.
- 杜{もり}の都{みやこ} | Mori no Miyako | Sendai's name for itself. Zelkova trees line the main streets.
- 伊達政宗{だてまさむね} | Date Masamune | Founded the city in 1600. Nicknamed the One-Eyed Dragon after losing an eye to smallpox.
- 支倉常長{はせくらつねなが} | Hasekura Tsunenaga | Masamune's envoy. Baptised in Rome in 1613, while Japan was busy banning the faith.
- 牛{ぎゅう}タン | Gyuutan | Grilled beef tongue. Invented here in 1948 and now the city's signature dish.
- ずんだ餅{もち} | Zunda mochi | Rice cakes under sweet mashed edamame. Bright green.
- 七夕{たなばた}まつり | Tanabata matsuri | Every August. The largest Tanabata festival in Japan; streamers hang three storeys down.

<script>
(function(){
  'use strict';
  var KEY = 'sendai-deck-v1';
  /* read before any render — show() rewrites the hash */
  var START_ROUTE = (location.hash || '').slice(1);
  var START = parseInt(START_ROUTE, 10);
  var SRC  = document.getElementById('content');
  var DECK = document.getElementById('deck');
  var model = [], i = 0, editing = false, dirty = false;

  /* ---------------- text -> html ---------------- */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function inline(s){
    if(s == null) return '';
    var out = esc(s);
    out = out.replace(/([一-鿿々㐀-䶿]+)\{([^{}]*)\}/g,
                      '<ruby>$1<rt>$2</rt></ruby>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    out = out.replace(/_{2,}/g, '<small>___</small>');
    out = out.replace(/ \/ /g, ' <small>/</small> ');
    return out;
  }

  /* ---------------- parse ---------------- */
  function parse(src){
    var slides = [], errors = [], cur = null, list = 'items';
    src.split('\n').forEach(function(raw, n){
      var line = raw.trim(), ln = n + 1;
      if(!line || line.charAt(0) === '#') return;
      if(line.slice(0,3) === '==='){
        var p = line.slice(3).split('|');
        cur = { type: (p[0]||'').trim(), rail: (p[1]||'aoba').trim(), f: {}, L: {} };
        if(!RENDER[cur.type]) errors.push('Line ' + ln + ': unknown slide type "' + cur.type + '"');
        slides.push(cur); list = 'items'; return;
      }
      if(!cur){ errors.push('Line ' + ln + ': text before the first === slide'); return; }
      if(line.slice(0,2) === '- '){
        (cur.L[list] = cur.L[list] || []).push(
          line.slice(2).split('|').map(function(x){ return x.trim(); }));
        return;
      }
      var m = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if(!m){ errors.push('Line ' + ln + ': expected "key: value" or "- item"'); return; }
      if(m[2] === ''){ list = m[1]; cur.L[list] = cur.L[list] || []; }
      else { cur.f[m[1]] = m[2]; }
    });
    return { slides: slides, errors: errors };
  }

  function serialize(slides){
    return '\n' + slides.map(function(s){
      var out = '=== ' + s.type + ' | ' + s.rail + '\n';
      Object.keys(s.f).forEach(function(k){ out += k + ': ' + s.f[k] + '\n'; });
      Object.keys(s.L).sort(function(a,b){
        return a === 'items' ? -1 : b === 'items' ? 1 : 0;
      }).forEach(function(n){
        if(n !== 'items') out += n + ':\n';
        s.L[n].forEach(function(row){ out += '- ' + row.join(' | ') + '\n'; });
      });
      return out;
    }).join('\n') + '\n';
  }

  /* ---------------- editable element builders ---------------- */
  function ce(ph){
    return editing ? ' contenteditable="true" spellcheck="false" data-ph="' + esc(ph) + '"' : '';
  }
  /* field */
  function F(si, key, tag, cls, ph, optional){
    var raw = model[si].f[key] || '';
    if(!raw && !editing && optional) return '';
    return '<' + tag + ' class="' + cls + '" data-i="' + si + '" data-f="' + key + '"' +
           ce(ph || key) + '>' + (editing ? esc(raw) : inline(raw)) + '</' + tag + '>';
  }
  /* list cell */
  function C(si, ln, r, c, tag, cls){
    var raw = (model[si].L[ln][r][c] || '');
    return '<' + tag + ' class="' + cls + '" data-i="' + si + '" data-l="' + ln +
           '" data-r="' + r + '" data-c="' + c + '"' + ce('…') + '>' +
           (editing ? esc(raw) : inline(raw)) + '</' + tag + '>';
  }
  function rows(si, ln){ return (model[si].L[ln] || []); }

  function streamers(){
    var cols = ['sakura','kin','aoba','sora','murasaki','hi'],
        xs = [8,15,23,79,86,93], out = '';
    for(var k = 0; k < 6; k++)
      out += '<i style="left:' + xs[k] + '%;background:var(--' + cols[k] +
             ');animation-delay:-' + (k * 1.3 + 0.4).toFixed(1) + 's"></i>';
    return '<div class="streamers">' + out + '</div>';
  }

  function jumpHTML(si){
    var raw = model[si].f.link || '';
    if(editing)
      return '<div class="jump" data-i="' + si + '" data-f="link"' + ce('Link label') + '>' +
             esc(raw) + '</div>';
    return '<a class="jump" href="#sheet">' + inline(raw) + '<span class="arw">\u2192</span></a>';
  }

  function chrome(si){
    var s = model[si], out = '';
    if(s.f.flag){
      var p = s.f.flag.split('|');
      out += '<div class="flag" data-i="' + si + '" data-f="flag"' + ce('If time') + '>' +
             (editing ? esc(s.f.flag)
                      : esc(p[0].trim()) + (p[1] ? ' <b class="j">' + inline(p[1].trim()) + '</b>' : '')) +
             '</div>';
    }
    return out;
  }

  /* ---------------- renderers ---------------- */
  var RENDER = {
    title: function(si){
      return F(si,'kanji','div','kanji','仙台') +
             F(si,'h1','h1','','Title') +
             F(si,'sub','div','sub','Subtitle', true);
    },
    toc: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        '<ul class="toc">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','n') +
                 C(si,'items',r,1,'span','j') + C(si,'items',r,2,'span','e') + '</li>';
        }).join('') + '</ul>';
    },
    bullets: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading') +
        '<ul class="bullets">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','t') +
                 C(si,'items',r,1,'span','d') + '</li>';
        }).join('') + '</ul>';
    },
    facts: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading') +
        '<ul class="facts">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','t') + C(si,'items',r,1,'span','r') +
                 C(si,'items',r,2,'span','d') + '</li>';
        }).join('') + '</ul>';
    },
    divider: function(si){
      return chrome(si) + F(si,'jp','div','jptitle','日本語') +
             F(si,'sub','div','sub','Section name') +
             F(si,'count','div','count','01 · two phrases', true);
    },
    phrase: function(si){
      var out = chrome(si) +
        '<div class="card">' + F(si,'romaji','div','romaji','Romaji') +
        F(si,'jp','div','jp','日本語') + F(si,'en','div','en','English') + '</div>' +
        F(si,'note','div','note','Note', true);
      if(rows(si,'vocab').length)
        out += '<ul class="vocab">' + rows(si,'vocab').map(function(_, r){
          return '<li>' + C(si,'vocab',r,0,'span','w') + C(si,'vocab',r,1,'span','k') +
                 C(si,'vocab',r,2,'span','g') + '</li>';
        }).join('') + '</ul>';
      if(rows(si,'chips').length)
        out += '<ul class="chips">' + rows(si,'chips').map(function(_, r){
          return '<li>' + C(si,'chips',r,0,'span','w') + C(si,'chips',r,1,'span','g') + '</li>';
        }).join('') + '</ul>';
      return out;
    },
    vocab: function(si){
      return chrome(si) + F(si,'eyebrow','div','eyebrow','Eyebrow', true) +
        F(si,'h2','h2','','Heading', true) +
        '<ul class="vocab">' + rows(si,'items').map(function(_, r){
          return '<li>' + C(si,'items',r,0,'span','w') + C(si,'items',r,1,'span','k') +
                 C(si,'items',r,2,'span','g') + '</li>';
        }).join('') + '</ul>' +
        F(si,'note','div','note','Note', true);
    },
    practice: function(si){
      var s = model[si], p = (s.f.tag || '').split('|');
      return chrome(si) +
        '<div class="tag" data-i="' + si + '" data-f="tag"' + ce('Pair practice') + '>' +
        (editing ? esc(s.f.tag || '')
                 : esc((p[0]||'').trim()) + (p[1] ? ' <b class="j">' + inline(p[1].trim()) + '</b>' : '')) +
        '</div>' + F(si,'task','p','task','Task') + F(si,'foot','div','foot','Footnote', true);
    }
  };

  /* ---------------- cheat sheet ----------------
     Built from `model`, so it can never drift from the Content Block. */
  function groups(){
    var out = [], cur = null;
    model.forEach(function(s){
      var isOpt = !!s.f.opt;
      if(s.type === 'divider'){
        cur = {title: s.f.sub || '', jp: s.f.jp || '', rail: s.rail, opt: false,
               items: [], words: []};
        out.push(cur); return;
      }
      if(s.type !== 'phrase' && s.type !== 'vocab') return;
      if(!cur || isOpt !== cur.opt){
        cur = {title: isOpt ? 'Extra phrases' : (cur ? cur.title : 'Phrases'),
               jp: isOpt ? '任意' : '', rail: s.rail, opt: isOpt, items: [], words: []};
        out.push(cur);
      }
      if(s.type === 'phrase')
        cur.items.push([s.f.romaji || '', s.f.jp || '', s.f.en || '']);
      else
        (s.L.items || []).forEach(function(r){ cur.items.push([r[0]||'', r[1]||'', r[2]||'']); });
      (s.L.vocab || []).forEach(function(r){ cur.words.push(r); });
    });
    return out.filter(function(g){ return g.items.length; });
  }

  function renderSheet(){
    var t = model[0] && model[0].f;
    document.getElementById('sheetTitle').textContent =
      ((t && t.h1) ? t.h1 + ' — ' : '') + 'Cheat sheet';
    document.getElementById('sheetBody').innerHTML = groups().map(function(g){
      var words = g.words.length
        ? '<ul class="wl">' + g.words.map(function(w){
            return '<li>' + esc(w[0] || '') + '<b>' + inline(w[1] || '') + '</b>' +
                   esc(w[2] || '') + '</li>';
          }).join('') + '</ul>'
        : '';
      return '<section class="grp' + (g.opt ? ' opt' : '') +
             '" style="--rail:var(--' + g.rail + ')"><h2>' + esc(g.title) +
             (g.jp ? '<span class="kj">' + inline(g.jp) + '</span>' : '') + '</h2>' +
             '<ul class="ph">' + g.items.map(function(it){
               return '<li><span class="r">' + inline(it[0]) + '</span>' +
                      '<span class="j">' + inline(it[1]) + '</span>' +
                      '<span class="e">' + inline(it[2]) + '</span></li>';
             }).join('') + '</ul>' + words + '</section>';
    }).join('');
  }

  var sheetOpen = false;
  function openSheet(){
    if(sheetOpen) return;
    sheetOpen = true;
    renderSheet();
    document.getElementById('sheet').hidden = false;
    document.body.classList.add('sheet-open');
    if(location.hash !== '#sheet'){ try { history.replaceState(null, '', '#sheet'); } catch(e){} }
    window.scrollTo(0, 0);
  }
  function closeSheet(){
    if(!sheetOpen) return;
    sheetOpen = false;
    document.getElementById('sheet').hidden = true;
    document.body.classList.remove('sheet-open');
    show(i);
  }
  function toggleSheet(){ sheetOpen ? closeSheet() : openSheet(); }

  /* ---------------- render ---------------- */
  function render(){
    DECK.innerHTML = model.map(function(s, si){
      var pre = (s.type === 'title' ? streamers() : '') +
                (s.f.sec ? F(si, 'sec', 'div', 'sec', 'section') : '');
      var body = RENDER[s.type] ? RENDER[s.type](si)
        : '<div class="fatal">Unknown slide type "' + esc(s.type) + '"</div>';
      if(s.f.link) body += jumpHTML(si);
      return '<section class="slide' + (s.type === 'practice' ? ' practice' : '') +
             (s.type === 'title' ? ' title' : '') + (s.type === 'divider' ? ' divider' : '') +
             (s.f.opt ? ' optional' : '') +
             '" style="--rail:var(--' + s.rail + ')">' + pre +
             '<div class="inner">' + body + '</div></section>';
    }).join('');
    show(i);
  }

  /* Shrink a slide only as far as it must go to fit. Type is set large by
     default; the dense grids scale themselves back down from there. */
  function fit(slide){
    if(!slide) return;
    var inner = slide.querySelector('.inner');
    if(!inner) return;
    slide.style.removeProperty('--u');
    var k = 1;
    for(var pass = 0; pass < 8; pass++){
      var cs = getComputedStyle(slide),
          avail = slide.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom),
          need = inner.getBoundingClientRect().height;
      if(!(avail > 0) || need <= avail + 0.5) break;
      k = Math.max(0.55, k * Math.max(0.88, avail / need));
      slide.style.setProperty('--u', 'calc(var(--u0) * ' + k.toFixed(4) + ')');
      if(k <= 0.55) break;
    }
  }

  function show(n){
    var slides = DECK.children;
    if(!slides.length) return;
    i = Math.max(0, Math.min(slides.length - 1, n));
    for(var k = 0; k < slides.length; k++) slides[k].classList.toggle('on', k === i);
    fit(slides[i]);
    var bar = document.getElementById('bar');
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    bar.style.background = getComputedStyle(slides[i]).getPropertyValue('--rail');
    document.getElementById('num').textContent = (i + 1) + ' / ' + slides.length;
    if(!sheetOpen){ try { history.replaceState(null, '', '#' + (i + 1)); } catch(e){} }
  }

  /* ---------------- load ---------------- */
  function load(src){
    var res = parse(src);
    if(res.errors.length){
      DECK.innerHTML = '<section class="slide on"><div class="fatal"><h3>' +
        res.errors.length + ' problem' + (res.errors.length > 1 ? 's' : '') +
        ' in the lesson text</h3>' + res.errors.map(esc).join('<br>') + '</div></section>';
      return false;
    }
    model = res.slides;
    render();
    return true;
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if(!(saved && load(saved))) { saved = null; load(SRC.textContent); }
  dirty = !!saved;

  /* ---------------- status bar ---------------- */
  var status = document.getElementById('status'), statusText = document.getElementById('statusText');
  function paintStatus(){
    var on = editing || dirty;
    status.classList.toggle('show', on);
    document.body.classList.toggle('editing', editing);
    statusText.innerHTML = editing
      ? 'Editing — click any text to change it. <kbd>Esc</kbd> when done.'
      : 'You have unsaved edits in this browser only. Press <kbd>S</kbd> to download index.html.';
  }
  function setEditing(on){ editing = on; render(); paintStatus(); }
  paintStatus();

  /* ---------------- capture edits ---------------- */
  DECK.addEventListener('input', function(e){
    var el = e.target.closest('[data-i]');
    if(!el) return;
    var s = model[+el.dataset.i], v = el.textContent;
    if(el.dataset.f !== undefined) s.f[el.dataset.f] = v;
    else s.L[el.dataset.l][+el.dataset.r][+el.dataset.c] = v;
    dirty = true;
    try { localStorage.setItem(KEY, serialize(model)); } catch(err){}
  });
  DECK.addEventListener('paste', function(e){
    if(!editing) return;
    e.preventDefault();
    document.execCommand('insertText', false,
      (e.clipboardData || window.clipboardData).getData('text/plain'));
  });

  /* ---------------- save / revert ---------------- */
  function save(){
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector('#content').textContent = serialize(model);
    clone.querySelector('#deck').innerHTML = '';
    clone.querySelector('#sheetBody').innerHTML = '';
    clone.querySelector('#sheetTitle').textContent = '';
    clone.querySelector('#sheet').hidden = true;
    clone.querySelector('body').classList.remove('sheet-open');
    clone.querySelector('#status').classList.remove('show');
    clone.querySelector('body').classList.remove('editing');
    var blob = new Blob(['<!doctype html>\n' + clone.outerHTML], {type: 'text/html'});
    var a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function revert(){
    if(dirty && !confirm('Discard your local edits and go back to the saved lesson text?')) return;
    try { localStorage.removeItem(KEY); } catch(e){}
    dirty = false; editing = false;
    load(SRC.textContent); paintStatus();
  }

  document.getElementById('btnSave').onclick   = save;
  document.getElementById('btnRevert').onclick = revert;
  document.getElementById('btnDone').onclick   = function(){ setEditing(false); };
  document.getElementById('next').onclick = function(){ show(i + 1); };
  document.getElementById('prev').onclick = function(){ show(i - 1); };

  /* ---------------- keys ---------------- */
  document.addEventListener('keydown', function(e){
    var typing = e.target.isContentEditable;
    if(e.key === 'Escape' && editing){ e.preventDefault(); setEditing(false); return; }
    if(typing) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === 'c' || e.key === 'C'){ e.preventDefault(); toggleSheet(); return; }
    if(sheetOpen){
      if(e.key === 'Escape'){ e.preventDefault(); location.hash = '#' + (i + 1); }
      return;
    }
    switch(e.key){
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown':
        e.preventDefault(); show(i + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
        e.preventDefault(); show(i - 1); break;
      case 'Home': e.preventDefault(); show(0); break;
      case 'End':  e.preventDefault(); show(DECK.children.length - 1); break;
      case 'e': case 'E': e.preventDefault(); setEditing(!editing); break;
      case 's': case 'S': e.preventDefault(); save(); break;
      case 'r': case 'R': e.preventDefault(); revert(); break;
      case 'f': case 'F':
        e.preventDefault();
        if(document.fullscreenElement) document.exitFullscreen();
        else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        break;
    }
  });

  window.addEventListener('hashchange', function(){
    var h = (location.hash || '').slice(1);
    if(h === 'sheet'){ openSheet(); return; }
    closeSheet();
    var nn = parseInt(h, 10);
    if(!isNaN(nn)) show(nn - 1);
  });
  document.getElementById('btnPrint').onclick = function(){ window.print(); };

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ fit(DECK.children[i]); }, 120);
  });
  if(document.fonts && document.fonts.ready)
    document.fonts.ready.then(function(){ fit(DECK.children[i]); });

  var x0 = null;
  document.addEventListener('touchstart', function(e){
    if(editing) return; x0 = e.changedTouches[0].clientX;
  }, {passive: true});
  document.addEventListener('touchend', function(e){
    if(x0 === null || editing) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 55) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive: true});

  if(START_ROUTE === 'sheet') openSheet();
  else show(isNaN(START) ? 0 : START - 1);
})();
</script>
</body>
</html>
